[project]
name = "agent-bench"
version = "0.1.0"
description = "Framework benchmarking workspace"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk",
  "langchain-core",
  "langchain-openai",
  "langgraph",
  "google-adk",
  "openai-agents",
  "python-dotenv>=1.0.1",
  "langchain-google-genai>=4.2.1",
  "pydantic-ai>=1.31.0",
  "logfire>=4.15.1",
  "crewai>=1.6.1",
  "pyautogen<0.3.0",
  "google-generativeai>=0.8.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
