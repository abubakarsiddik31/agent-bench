[project]
name = "agent-bench"
version = "0.1.0"
description = "Framework benchmarking workspace"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk",
  "openai-agents",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
