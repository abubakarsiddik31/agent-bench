<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Agent Bench logo">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="ab-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- rounded card background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#ab-bg)" />

  <!-- stylized "AB" mark: A as a chart bar cluster, B as a benchmark gauge -->
  <g transform="translate(48,56)">
    <!-- A: ascending bars -->
    <rect x="0" y="96" width="20" height="48" rx="4" fill="url(#ab-accent)" opacity="0.55" />
    <rect x="28" y="64" width="20" height="80" rx="4" fill="url(#ab-accent)" opacity="0.75" />
    <rect x="56" y="32" width="20" height="112" rx="4" fill="url(#ab-accent)" />
    <!-- connector -->
    <rect x="84" y="72" width="12" height="12" rx="3" fill="#38bdf8" opacity="0.6" />

    <!-- B: benchmark gauge / score ring -->
    <g transform="translate(108, 40)">
      <circle cx="48" cy="48" r="44" fill="none" stroke="#1e293b" stroke-width="12" />
      <path
        d="M 48 4 A 44 44 0 1 1 4 48"
        fill="none"
        stroke="url(#ab-accent)"
        stroke-width="12"
        stroke-linecap="round"
      />
      <circle cx="48" cy="48" r="10" fill="url(#ab-accent)" />
      <!-- needle -->
      <line x1="48" y1="48" x2="78" y2="22" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
